# Run the whole site with:  docker compose up -d
# Generate the secrets first with:  npm run keys   (or see DEPLOY.md)

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: "true"
      DATA_DIR: /app/data
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env — see DEPLOY.md}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Microbiome 2026 <no-reply@example.ac.il>}
      MAIL_BCC: ${MAIL_BCC:-}
    volumes:
      - conference-data:/app/data

volumes:
  conference-data:
