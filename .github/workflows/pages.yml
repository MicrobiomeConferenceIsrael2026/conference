# Publishes docs/ to GitHub Pages on every push to main.
#
# One-time setup in your repository:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# The build is deterministic: it renders lib/content.js through the templates,
# and fails the run rather than publishing if anything is broken.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build the site
        run: npm run build

      # enablement: true turns Pages on if it isn't already, instead of failing
      # with "Get Pages site failed … Not Found". Without it, someone has to
      # visit Settings → Pages and pick "GitHub Actions" before the first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
