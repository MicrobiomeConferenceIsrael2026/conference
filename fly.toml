# Fly.io. Deploy with:
#   fly launch --no-deploy --copy-config
#   fly volumes create conference_data --size 1
#   fly secrets set MASTER_KEY=... SESSION_SECRET=... ADMIN_PASSWORD_HASH=...
#   fly deploy
# Change app_name and primary_region to suit (mad = Madrid, fra = Frankfurt).

app = "microbiome-2026"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "true"
  DATA_DIR = "/data"

[[mounts]]
  source = "conference_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
